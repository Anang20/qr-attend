<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Detail presensi (desktop) · QR Attend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F8FAFC}
a{color:#047857}a:hover{color:#064E3B}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; gap: 16px; background: #F8FAFC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111827">
<dc-import name="Sidebar" role="student" active="history" height="868" hint-size="256px,868px"></dc-import>
<div style="width: 1136px; display: flex; flex-direction: column; gap: 24px">
<dc-import name="Topbar" user-name="Ray Pengki" user-role="Mahasiswa · SI-5A" initials="RP" search-placeholder="Cari mata kuliah atau riwayat presensi…" profile-href="StudentProfileDesktop.dc.html" hint-size="1136px,72px"></dc-import>
<main style="display: flex; flex-direction: column; gap: 20px; padding: 0 8px">
<div style="display: flex; flex-direction: column; gap: 8px">
<nav aria-label="Breadcrumb" style="display: flex; gap: 8px; font-size: 13px; color: #6B7280"><a href="StudentHistoryDesktop.dc.html" style="text-decoration: none; color: #6B7280">Riwayat Presensi</a><span aria-hidden="true">/</span><span aria-current="page" style="color: #111827; font-weight: 600">Detail</span></nav>
<div style="display: flex; align-items: center; gap: 14px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">Pemrograman Web · Pertemuan 5</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #DCFCE7; color: #166534"><span style="width: 8px; height: 8px; border-radius: 999px; background: #16A34A"></span>Hadir</span>
</div>
<p style="margin: 0; font-size: 15px; color: #6B7280">Senin, 28 September 2026</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start">
<section aria-label="Rincian presensi" style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E5E7EB; padding: 8px 24px">
<dl style="margin: 0; display: flex; flex-direction: column">
<sc-for list="{{details}}" as="d" hint-placeholder-count="7"><div style="display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid {{d.line}}; font-size: 14px"><dt style="color: #6B7280">{{d.k}}</dt><dd style="margin: 0; font-weight: 700; font-variant-numeric: tabular-nums">{{d.v}}</dd></div></sc-for>
</dl>
</section>
<section aria-labelledby="tl-title" style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E5E7EB; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="tl-title" style="margin: 0; font-size: 16px; font-weight: 700">Linimasa</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center"><span style="width: 12px; height: 12px; border-radius: 999px; background: {{s.dot}}; margin-top: 4px"></span><span style="width: 2px; flex-grow: 1; background: {{s.line}}; min-height: 26px"></span></div>
<div style="display: flex; flex-direction: column; gap: 3px; padding-bottom: 18px"><span style="font-size: 15px; font-weight: 600">{{s.t}}</span><span style="font-size: 13px; color: #6B7280">{{s.d}}</span></div>
</li>
</sc-for>
</ol>
<a href="StudentHistoryDesktop.dc.html" style="align-self: flex-start; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #E5E7EB; color: #111827; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Kembali ke riwayat</a>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var details = [
      { k: 'Kelas', v: 'SI-5A' }, { k: 'Jadwal', v: '08.00 – 09.40' }, { k: 'Ruang', v: 'Ruang 301' },
      { k: 'Dosen', v: 'Gusmayeni, S.Kom., M.Kom' }, { k: 'Waktu presensi', v: '08.05.17' },
      { k: 'Metode', v: 'QR Code' }, { k: 'Jarak dari titik', v: '3,2 m (batas 5 m)' }
    ];
    var steps = [
      { t: 'Sesi dibuka oleh dosen', d: '08.05.00 · QR berlaku hingga 08.25.00' },
      { t: 'QR Code dipindai', d: '08.05.15 · Ruang 301' },
      { t: 'Ketujuh validasi lolos', d: 'Kelas, jadwal, lokasi, dan cek duplikasi' },
      { t: 'Tercatat Hadir', d: '08.05.17 · Metode: QR Code' }
    ];
    return {
      details: details.map(function (d, i) { return Object.assign({}, d, { line: i === details.length - 1 ? 'transparent' : '#F3F4F6' }); }),
      steps: steps.map(function (s, i) {
        return Object.assign({}, s, { dot: i === steps.length - 1 ? '#15803D' : '#6EE7B7', line: i === steps.length - 1 ? 'transparent' : '#D1FAE5' });
      })
    };
  }
}
</script>
</body>
</html>

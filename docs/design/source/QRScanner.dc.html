<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pindai QR · QR Attend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0B1712}
@keyframes qr-scan{0%{top:8%}50%{top:88%}100%{top:8%}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 920px; box-sizing: border-box; background: #0B1712; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF; overflow: hidden">
<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 48px 20px 0">
<a href="TodayClass.dc.html" aria-label="Tutup pemindai" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Pindai QR presensi</h1>
<button type="button" onClick="{{toggleTorch}}" aria-label="Senter" aria-pressed="{{torch}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: {{torchBg}}; color: {{torchFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v5l-3 4v11H9V11L6 7z"></path><path d="M12 14v2"></path></svg></button>
</header>

<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 32px">
<a href="{{simHref}}" aria-label="Jendela kamera. Arahkan ke QR Code dari dosen" style="position: relative; display: block; width: 264px; height: 264px; border-radius: 28px; background: #13251D; overflow: hidden">
<svg width="264" height="264" viewBox="0 0 264 264" fill="none" aria-hidden="true" style="position: absolute; inset: 0"><path d="M4 60V28A24 24 0 0 1 28 4h32M204 4h32a24 24 0 0 1 24 24v32M260 204v32a24 24 0 0 1-24 24h-32M60 260H28A24 24 0 0 1 4 236v-32" stroke="#34D399" stroke-width="6" stroke-linecap="round"></path></svg>
<span style="position: absolute; left: 24px; right: 24px; top: 50%; height: 2px; border-radius: 2px; background: #34D399; box-shadow: 0 0 16px 2px rgba(52,211,153,0.6); animation: qr-scan 2.4s ease-in-out infinite"></span>
</a>
<p style="margin: 0; max-width: 280px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.5">Pindai QR Code yang ditampilkan oleh dosen Anda.</p>
<label style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 999px; border: 1px dashed rgba(167,243,208,0.5); font-size: 12px; font-weight: 600; color: #A7F3D0">Simulasi (prototipe)<select value="{{sim}}" onChange="{{onSim}}" aria-label="Simulasi hasil pindaian" style="height: 32px; max-width: 190px; padding: 0 8px; border-radius: 999px; border: 0; font: inherit; font-size: 12px; font-weight: 700; color: #064E3B; background: #D1FAE5"><sc-for list="{{simOptions}}" as="o" hint-placeholder-count="8"><option value="{{o.id}}">{{o.label}}</option></sc-for></select></label>
</div>

<section aria-label="Validasi sesi" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; color: #111827; border-radius: 28px 28px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #E5E7EB"></span>
<div role="note" style="display: flex; gap: 10px; padding: 12px; border-radius: 14px; background: #ECFDF5; color: #065F46; font-size: 13px; line-height: 1.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>Pastikan Anda berada di dalam kelas dan dalam radius 5 meter dari titik presensi yang ditentukan.</span></div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #6B7280">Mata kuliah</dt><dd style="margin: 0; font-size: 14px; font-weight: 700">Pemrograman Web</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #6B7280">Kelas</dt><dd style="margin: 0; font-size: 14px; font-weight: 700">SI-5A</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #6B7280">Ruang</dt><dd style="margin: 0; font-size: 14px; font-weight: 700">Ruang 301</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #6B7280">Jarak Anda</dt><dd style="margin: 0; font-size: 14px; font-weight: 700; color: #047857">3,2 m · dalam jangkauan</dd></div>
<div style="display: flex; flex-direction: column; gap: 4px"><dt style="font-size: 12px; color: #6B7280">Status sesi</dt><dd style="margin: 0"><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #DCFCE7; color: #166534"><span style="width: 6px; height: 6px; border-radius: 999px; background: #16A34A"></span>Dibuka</span></dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #6B7280">Sisa waktu</dt><dd style="margin: 0; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">19:42</dd></div>
</dl>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { torch: false, sim: 'success' };
  }
  // Simulasi hasil pindaian (khusus prototipe). Di aplikasi nyata hasil ditentukan server
  // setelah mengecek sesi, kelas, jadwal, duplikasi, dan radius.
  simOptions() {
    return [
      { id: 'success', label: 'Berhasil' },
      { id: 'outsideRadius', label: 'Gagal · di luar radius 5 m' },
      { id: 'lowAccuracy', label: 'Gagal · lokasi kurang akurat' },
      { id: 'expired', label: 'Gagal · QR kedaluwarsa' },
      { id: 'wrongClass', label: 'Gagal · bukan kelasnya' },
      { id: 'wrongSchedule', label: 'Gagal · di luar jadwal' },
      { id: 'duplicate', label: 'Gagal · sudah presensi' },
      { id: 'invalidQR', label: 'Gagal · QR tidak valid' },
      { id: 'unauthorized', label: 'Gagal · sesi login berakhir' }
    ];
  }

  renderVals() {
    var self = this;
    var on = this.state.torch;
    return {
      sim: this.state.sim,
      simOptions: this.simOptions(),
      onSim: function (e) { self.setState({ sim: e.target.value }); },
      simHref: this.state.sim === 'success' ? 'AttendanceSuccess.dc.html' : 'AttendanceFailed.dc.html#' + this.state.sim,
      torch: on ? 'true' : 'false',
      torchBg: on ? '#FDE68A' : 'rgba(255,255,255,0.12)',
      torchFg: on ? '#111827' : '#FFFFFF',
      toggleTorch: function () { self.setState({ torch: !self.state.torch }); }
    };
  }
}
</script>
</body>
</html>
